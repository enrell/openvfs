name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly deep run of the randomized suites

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo test --workspace

  deep:
    # Many more random histories than the default run; on schedule or on demand.
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[deep]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release -p openvfs --test it -- differential:: overlay:: concurrency::
        env:
          OPENVFS_DIFF_CASES: "3000"
          OPENVFS_DIFF_STEPS: "200"
          OPENVFS_PROP_CASES: "3000"
          OPENVFS_PROP_CASES_DISK: "300"
          # the scaled-up runs legitimately take longer than the default 3-minute deadline
          OPENVFS_TEST_DEADLINE_SECS: "7200"

