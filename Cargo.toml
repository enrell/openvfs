[workspace]
resolver = "3"
members = ["crates/openvfs", "crates/openvfs-mods", "crates/openvfs-sandbox"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
# let-chains (`if let … && …`) need 1.88.
rust-version = "1.88"
authors = ["openvfs contributors"]
repository = "https://github.com/enrell/openvfs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
assert_is_empty = "allow"

[profile.test]
# The differential and concurrency suites do a lot of work; keep them quick.
opt-level = 1
